name: CLI
on:
  pull_request:
  push:
    branches: [master, 'feat/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: python3 scripts/completeness.py
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test ./internal/schemacheck -run='^$' -fuzz=FuzzSchemaCheck -fuzztime=10s -parallel=2
      - run: go build -trimpath -o bin/woobe ./cmd/woobe
      - run: bin/woobe help --output json > discovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-validation
          path: |
            coverage.out
            discovery.json
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go build -trimpath -o dist/woobe-${{ matrix.os }}-${{ matrix.arch }} ./cmd/woobe
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
