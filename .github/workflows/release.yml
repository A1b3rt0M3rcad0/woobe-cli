name: Release CLI
run-name: Release CLI v${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed canonical VERSION (without v prefix)
        required: true
        type: string
      revision:
        description: Optional exact master commit; retries otherwise recover the release tag
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-cli
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - name: Require the canonical workflow source
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/master
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - id: identity
        name: Resolve an immutable reviewed release revision
        env:
          CLI_VERSION: ${{ inputs.version }}
          CLI_REVISION: ${{ inputs.revision }}
        run: python3 scripts/release_identity.py --version "$CLI_VERSION" --revision "$CLI_REVISION" --output "$GITHUB_OUTPUT"
  validate:
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      revision: ${{ needs.identity.outputs.revision }}
  publish:
    needs: [identity, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.revision }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.9.0
      - name: Verify, preflight both destinations, publish and check exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLI_VERSION: ${{ needs.identity.outputs.version }}
          CLI_REVISION: ${{ needs.identity.outputs.revision }}
          CANDIDATE_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
        run: python3 scripts/publish_release.py --version "$CLI_VERSION" --commit "$CLI_REVISION" --manifest-sha256 "$CANDIDATE_SHA256"
      - name: Record installation commands
        env:
          CLI_VERSION: ${{ needs.identity.outputs.version }}
          CLI_REVISION: ${{ needs.identity.outputs.revision }}
        run: |
          {
            echo "Released woobe-cli $CLI_VERSION from $CLI_REVISION"
            echo "npm install --global woobe-cli@$CLI_VERSION"
            echo "npx --package=woobe-cli@$CLI_VERSION woobe version"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$CLI_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
