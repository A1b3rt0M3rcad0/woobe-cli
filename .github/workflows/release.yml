name: Release CLI
run-name: Release CLI ${{ inputs.version || github.sha }}
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Optional exact version for recovery or prerelease; empty calculates automatically
        required: false
        type: string
      revision:
        description: Optional exact master commit for recovery
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-cli
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
      revision: ${{ steps.identity.outputs.revision }}
      skip: ${{ steps.identity.outputs.skip }}
    steps:
      - name: Require the canonical workflow source
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/master
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: identity
        name: Resolve an immutable reviewed release revision
        env:
          CLI_VERSION: ${{ inputs.version }}
          CLI_REVISION: ${{ inputs.revision || (github.event_name == 'push' && github.sha) || '' }}
        run: python3 scripts/release_identity.py --version "$CLI_VERSION" --revision "$CLI_REVISION" --output "$GITHUB_OUTPUT"
  validate:
    needs: identity
    if: needs.identity.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.identity.outputs.version }}
      revision: ${{ needs.identity.outputs.revision }}
  publish:
    needs: [identity, validate]
    if: needs.identity.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.revision }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Verify native candidate, publish to GitHub and check exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ needs.identity.outputs.version }}
          CLI_REVISION: ${{ needs.identity.outputs.revision }}
          CANDIDATE_SHA256: ${{ needs.validate.outputs.manifest_sha256 }}
        run: python3 scripts/publish_release.py --version "$CLI_VERSION" --commit "$CLI_REVISION" --manifest-sha256 "$CANDIDATE_SHA256"
      - name: Record installation commands
        env:
          CLI_VERSION: ${{ needs.identity.outputs.version }}
          CLI_REVISION: ${{ needs.identity.outputs.revision }}
        run: |
          {
            echo "Released woobe-cli $CLI_VERSION from $CLI_REVISION"
            echo "Download the archive for your platform, verify SHA256SUMS, extract and run woobe version."
            echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$CLI_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
